name = "lonnylot"
compatibility_date = "2026-07-21"
workers_dev = true

# Apex + www served by this Worker (zone already on Cloudflare)
routes = [
  { pattern = "lonnylot.com/*", zone_name = "lonnylot.com" },
  { pattern = "www.lonnylot.com/*", zone_name = "lonnylot.com" },
]

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
